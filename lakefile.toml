name = "lattice_volume_interpolation"
version = "0.1.0"
keywords = ["math", "geometry-of-numbers", "lattices", "lean"]
defaultTargets = ["LatticeVolumeInterpolation"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[require]]
name = "discrete_minkowski"
git = "https://github.com/LeonardoSanBenitez/discrete-minkowski-lean.git"
rev = "bce1544"

[[lean_lib]]
name = "LatticeVolumeInterpolation"
globs = ["LatticeVolumeInterpolation", "LviBasic", "PaperNotation", "SuccessiveMinimaBridge", "BoxCounts", "CoordinateLattice", "StandardLattice", "CoordinateMinima", "BoxEquality", "SimplexCounts", "SimplexLattice", "SimplexInteriorCounts", "SimplexInteriorLattice", "SimplexMinima", "SimplexVolume", "SimplexEquality", "ConcaveIntegralBounds", "BetaIntegral", "JoinVolume", "GeneralRogersShephard", "AntiBlocking", "Davenport", "ProjectionShaking", "GeneralDavenport", "WeightedSimplex", "AntiBlockingUpperBound", "MinimaAntiBlocking", "TheoremOneOne", "CoordShaking", "ShakingIterate", "ClaimOne", "Triangularize", "Unimodular", "TheoremThreeOne", "UpperBound", "ProductBoundLimit", "DilationBridge", "VanDerCorput", "CoveringRadius", "CoveringRadiusAttainment", "GaugeMinima", "PropOneSix", "CoveringTile", "Tiles", "ShakingInterior", "ReverseSchymura", "TheoremOneThreeTight", "ProjectedLattice", "ProjectedLatticeInstances", "OrthogonalLatticeSplit", "OrthogonalLatticeDiscrete", "ProjectedDeterminantBound", "ProjectedCovolume", "MinkowskiLower", "MinkowskiBounds", "PlanarSections", "TheoremOneFourCore", "TheoremOneFourLower", "GeneralShaking", "GeneralOrthShaking", "LemmaFiveOne", "TheoremOneFour", "PlanarRows", "Pick", "PropOneFive", "BoundarySections", "BoundaryRowCount", "BoundaryMinima", "BoundaryFirstDirection", "SeparatedIntervals"]
